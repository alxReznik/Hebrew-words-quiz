<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hebrew Words Quiz</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="quiz-container">
        <button id="restart-btn" class="restart-btn" type="button">התחל מחדש</button>
        <h1>התאם מילה לתמונה</h1>
        <p id="score">ניקוד: 0 / 0</p>

        <div class="image-wrapper">
            <img id="quiz-image" alt="תמונת שאלה" />
        </div>

        <div id="options" class="options"></div>

        <p id="feedback" class="feedback"></p>
        <button id="next-btn" class="next-btn" type="button" hidden>שאלה הבאה</button>
    </main>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
